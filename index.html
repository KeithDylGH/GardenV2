<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
          "path": "https://aistudiocdn.com/path@^0.12.7",
          "vite": "https://aistudiocdn.com/vite@^7.2.0",
          "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
          "url": "https://aistudiocdn.com/url@^0.11.4"
        }
      }
    </script>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("garden-service-tracker");
          if (saved) {
            const state = JSON.parse(saved);
            const mode = state.themeMode;
            const color = state.themeColor;
            
            // Robust Dark Mode Check:
            // 1. Explicit 'dark' mode
            // 2. 'system' mode with system dark preference
            // 3. Undefined mode (fallback) with system dark preference
            const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = 
              mode === "dark" || 
              (mode === "system" && systemDark) || 
              (!mode && systemDark);

            if (isDark) {
              document.documentElement.classList.add("dark");
              if (color === "bw") {
                document.documentElement.classList.add("theme-black");
                document.documentElement.style.backgroundColor = "#000000";
                document.body.style.backgroundColor = "#000000";
              } else {
                document.documentElement.style.backgroundColor = "#0f172a";
                document.body.style.backgroundColor = "#0f172a";
              }
            } else {
              document.documentElement.classList.remove("dark", "theme-black");
              document.documentElement.style.backgroundColor = "#f3f4f6";
              document.body.style.backgroundColor = "#f3f4f6";
            }
          }
        } catch (e) {
          console.error("Error setting initial theme", e);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
