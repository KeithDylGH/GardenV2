<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />

    <link rel="manifest" href="/manifest.json" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
          "path": "https://aistudiocdn.com/path@^0.12.7",
          "vite": "https://aistudiocdn.com/vite@^7.2.0",
          "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
          "url": "https://aistudiocdn.com/url@^0.11.4"
        }
      }
    </script>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("garden-service-tracker");
          if (saved) {
            const state = JSON.parse(saved);
            const mode = state.themeMode;
            
            const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isBlack = mode === "black";
            const isDark = isBlack || mode === "dark" || ((mode === "system" || !mode) && systemDark);

            if (isDark) {
              document.documentElement.classList.add("dark");
              if (isBlack) {
                document.documentElement.classList.add("theme-black");
                document.documentElement.style.backgroundColor = "#000000";
                document.body.style.backgroundColor = "#000000";
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#000000');
              } else {
                document.documentElement.style.backgroundColor = "#0f172a";
                document.body.style.backgroundColor = "#0f172a";
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#0f172a');
              }
            } else {
              document.documentElement.classList.remove("dark", "theme-black");
              document.documentElement.style.backgroundColor = "#f3f4f6";
              document.body.style.backgroundColor = "#f3f4f6";
              const meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', '#3b82f6');
            }
          }
        } catch (e) {
          console.error("Error setting initial theme", e);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
